name: CI

# The repository had no checks: PR #16 merged with an empty status roll-up, and
# the only thing standing between a broken invariant and `main` was whoever ran
# `npm test` locally. This workflow is that person, automated.
#
# The three steps below are deliberately the same three an agent runs locally
# through `scripts/agent/run.mjs`. If CI and `npm run check` ever disagree, the
# bug is in the runner, not in the workflow.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: lint, tests, build and generated docs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm

      # `npm ci` needs the lockfile to match package.json exactly; that is the
      # point — a drifting lockfile is a reproducibility failure, not a warning.
      - name: Install
        run: npm ci

      # Seconds, not minutes: a broken link or a lint error should fail before
      # the suite starts, so the annotation names the real problem.
      - name: Instant checks (lint)
        run: node scripts/agent/run.mjs --only=lint --quiet

      # The full gate: tests in five workspaces, guardrails, the CSV sample, the
      # build, the generated coverage document's drift, and the tasks.json
      # contract. One command, one verdict, the same one an agent sees locally.
      - name: Full check
        run: npm run check
